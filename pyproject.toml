[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optattacklens"
version = "0.1.0"
description = "A lightweight toolkit for profiling and analyzing optimization-based LLM attacks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "matplotlib>=3.8",
]

[project.scripts]
optattacklens = "optattacklens.cli:main"


[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 88